# Storyline 本地 MCP Server 配置样例（对应设计文档 [local_mcp_server]）。
# 本仓库不发起网络：video_editing.load_storyline_config 仅用标准库 tomllib 解析此文件，
# 供 build_node_registry(allowed=storyline_available_nodes(cfg)) 做节点白名单，
# 真实接入时再把 server_url 交给 mcp 模块建 StreamableHttp 传输。
[local_mcp_server]
server_name = "storyline"
server_cache_dir = ".storyline/.server_cache"
server_transport = "streamable-http"
url_scheme = "http"
connect_host = "127.0.0.1"
inline_media = "auto"
port = 8001
path = "/mcp"
json_response = true
stateless_http = false
# 单次工具调用超时。600 s 够跑完剪辑节点，但**装不下** `plan_motion`：它是逐镜写手
# + 草稿真渲，32 镜实测要十几到二十几分钟（2026-10-18 run 8c5e161ddb20 在 600 s 处
# 被掐断，模型重发三次，同一份分镜写了三遍）。MCP 口在这里放宽，Agent 侧另有
# `_TOOL_CALL_TIMEOUTS` 只给 plan_motion 开 2700 s，其余工具仍是 650 s。
timeout = 2700

# 节点包扫描（R16）：先扫出包内所有有 `name` 的 BaseNode 子类，再按 available_nodes 裁。
# 缺这个键 = 不扫包，只按下面的显式白名单注册（旧行为）。两份 TOML 必须同步。
available_node_pkgs = [
    "storyline_server.nodes.core_nodes",
    "storyline_server.nodes.web_nodes",
    "storyline_server.nodes.simple_nodes",
]

# 暴露给 Agent 的剪辑节点白名单（这里用工具名，与 Node.name 对齐；对应流程图节点全集）。
available_nodes = [
    "search_media", "load_media",
    "split_shots", "understand_clips", "filter_clips", "group_clips",
    "asr", "correct_transcript", "speech_rough_cut",
    "script_template_rec", "generate_script", "generate_ai_transition",
    "transition_rec", "text_rec", "generate_voiceover", "select_BGM",
    "plan_timeline", "plan_timeline_pro", "plan_timeline_ai_transition",
    "render_video", "render_web",
    # 局部改：只对已出片的某一版重烧受影响的镜/窗口，不重做整片。
    # 白名单少一行就等于「那一版改不动」：工具列不出来，前端选区改的派发直接失败。
    "patch_video",
    # 2026-10-25：`plan_motion` / `render_motion_code` / `patch_motion_code` 三个**摘了**。
    # 它们就是「图形科普片」那条约 1.9 万行的链（逐镜写手 + 21 道闸 + ffmpeg 拼接），
    # 已被简洁线替掉——同样一条 60 秒片子：那边 201 次调用 / 56.4 分钟，
    # 这边 24 次 / 15 分钟，而且产物是**可改的工程**（改一镜只重写一镜）。
    # 摘白名单而不是删代码：「模型能看见谁」由这张表决定，摘一行立刻生效、
    # 加回去也只需一行。代码留在 `storyline_server/motion/`，等第 8 周再移 attic。
    # 素材供给那三个工具（`search_illustration` / `select_illustration` / `imagegen`）
    # 2026-10-16 摘了：图形片的画面只有一路——模型逐镜写代码画（闸⑦「每镜必画」）。
    # 白名单里留一行不存在的工具，真机表现是「模型能看见它、点了必失败」；节点类与
    # 那三行由 test_video_editing.py 的白名单↔注册表相等那条用例一并守着。
    # 控制面工具（非 DAG 节点）：read_node_history 读 Store，render_status 轮询渲染任务。
    # 少了 render_status，模型收到「去轮询」的指示却没有可轮询的工具，等于没改。
    # preview_voice / preview_caption 见 config.docker.toml 那条注释：它们是「文字库」
    # 试听键与样式样张的入口，进白名单的理由是主服务侧的注册表就按这张表建
    # （与两份白名单逐项相等那条用例是两回事）。
    "read_node_history", "render_status", "preview_voice", "preview_caption",
    # 三个自检工具（非 DAG 节点，**不带契约**）：建模在交活**之前**自己跑一遍判据——
    # ① 这一段 TSX 过不过闸①；② 整片九道闸怎么判；③ 这一镜渲出来长什么样。
    # 它们没有 `require_node`，但必须在白名单里：这张表同时决定主服务注册表里有谁，
    # 少一行模型就调不到（`storyline_server/server.py::_register_selfcheck`）。
    # 不带契约决定的是「会不会被按计划裁」——这三个不带，所以规划轮与执行轮都在。
    "check_shot_code", "check_film", "preview_shot",
    # DAG 契约本身（`_register_dag_contract`）：**这是模型看全图的唯一一条路**。
    # 提示词库那句「要看整张图——有哪些节点、各依赖谁、参数什么形状——调 `dag_contract`」
    # 指的是它，而 2026-10-16 真机核对时发现：服务端**一直**注册着它（`[storyline]
    # tools=33` 里那一份），可主服务侧按**这张表**筛选入册，而表里从来没写过它 ——
    # 于是模型照着提示词去调，拿到的是 UnknownTool（`register_mcp_tools` 的
    # `_matches(name, enabled_tools)` 那一跳）。少这一行＝那句提示词教模型调一个
    # 不存在的工具，正是 `consistency.WATCHED` 那条检查存在的理由；名字已一并收进
    # 那份清单，下次再被静默摘掉启动就报。
    "dag_contract",
    # 简洁视频线：拆成三个原子节点（2026-10-27），替代原来的黑盒 simple_film。
    #   plan_short_film  →  write_short_shots  →  render_short_film
    # 依赖用 required_nodes 声明，拦截器递归补齐；render 是分钟级，已登记进
    # server.LONG_RUNNING_NODES，走「提交 + 轮询 render_status」。
    "plan_short_film", "write_short_shots", "render_short_film",
]

# ---------------------------------------------------------------------------
# [storage]：上线存储层（PG 元数据 + MinIO 媒体字节，设计文档 §1/§6/§8）
# 密钥与端点五项（PG_DSN / MINIO_ENDPOINT / MINIO_ACCESS_KEY / MINIO_SECRET_KEY /
# MINIO_BUCKET）只从环境变量或 .env 读，绝不写进本文件（本文件随仓库发布）。
# backend 仅接受 "pg_minio"（生产）与 "memory"（离线测试替身）。
# 下面两个目录是可丢弃缓存，不是数据：cache_root 是 localize 的 sha256 内容寻址**根**
# （对象存储层在其下再开 objects/{sha} 子目录，此处勿带 objects 段，否则会落成双层前缀），
# workspace_root 是渲染期临时工作区（抽帧/抽音/配音/转场/成片中转），成片终点即整目录
# 回收、崩溃残留按 workspace_ttl_sec 过期清扫，内容缓存超容量按最后访问时间 LRU 逐出。
# 素材与 BGM 一律查 materials 表；成片字节在 MinIO renders/，播放走 presigned URL。
# ---------------------------------------------------------------------------
[storage]
backend = "pg_minio"
workspace_root = ".storyline/workspace"
cache_root = ".storyline/cache"
workspace_max_gb = 20.0
workspace_ttl_sec = 21600.0

# ---------------------------------------------------------------------------
# [capabilities]：真实节点的外部能力与剪辑参数
# 这里只写环境变量名，绝不写值。视觉理解默认与主 LLM 同源（DeepSeek 的
# deepseek-flash 实测能吃 image_url）——**一个 key 用到底**，不必再注册第二家服务商。
# key 的来路按优先级：页面「设置」（PG app_secrets，按用户）→ vl_key_env 指的变量 →
# 主 LLM 的 key 源；understand_clips 每轮解析一次后显式传给 vision()，所以改完不用重启。
# 网络能力（VL/TTS）失败时节点走降级路径，不阻断整链出片。
# ---------------------------------------------------------------------------
[capabilities]
vl_base = "https://api.deepseek.com"
vl_model = "deepseek-flash"      # 需支持 image_url；deepseek-v4-pro 不支持（实测丢图）
vl_key_env = "OPENAI_API_KEY"    # 第二层回落；前端配过 key 时这一项用不上
vl_max_tokens = 1024             # 思考型模型：预算太小 content 会空（256 实测稳定空返回）
vl_thinking = false              # 默认关思考：逐镜一次请求，实测快约 2 倍、省约 4 倍输出 token
asr_model = "small"        # faster-whisper 权重（本地 GPU）
asr_device = "auto"        # auto→cuda，失败回落 cpu+int8
# 单次外部能力调用上限（ASR/文案 LLM/TTS）：卡死的第三方超时降级，不冻住整条链
provider_timeout_sec = 180.0
tts_voice = "zh-CN-XiaoxiaoNeural"
scene_threshold = 0.3
max_pause_sec = 1.0
bgm_volume = 0.2
# 字幕字体搜索目录，按序尝试；Linux/macOS 部署时改成本机字体目录即可
font_dirs = ["C:/Windows/Fonts", "/usr/share/fonts", "/System/Library/Fonts"]
# 渲染改成「提交 + 轮询」（不写这三行即用下列默认值）：
#   render_grace_sec = 20.0    —— render_video 的内联等待，短片一次调用即拿到成片
#   render_wait_max_sec = 300.0 —— 调用方显式要 wait_sec 的上限，须明显小于上面的 timeout
#   render_max_concurrent = 2  —— 同时在跑的渲染数（ffmpeg/MoviePy 是 CPU 密集型）
# 超过内联等待仍未跑完时，render_video 回 status=queued/running，由 render_status 轮询。
