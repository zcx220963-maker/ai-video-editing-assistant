<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1140" width="760" role="img" aria-label="智能创作助手 Agent 架构总览">
<title>智能创作助手 · Agent 架构总览</title>
<desc>六层架构：接入与并发、Agent 内核、横切能力、协作层、领域编排、基础设施，以及贯穿六层的设计哲学。</desc>

<rect x="0" y="0" width="760" height="1140" fill="#FFFFFF"/>
<text x="32" y="44" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#111827">智能创作助手 · Agent 架构总览</text>
<text x="32" y="72" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="13" fill="#6B7280">一句话驱动的视频创作 Agent：接入 → 内核 → 横切 → 协作 → 编排 → 基础设施</text>

<!-- ===== ① 接入与并发 ===== -->
<rect x="30" y="96" width="700" height="132" rx="12" fill="#EEF4FE" stroke="#3B82F6" stroke-width="1"/>
<text x="48" y="124" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">① 接入与并发 · Kafka MQ</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="138" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="152" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">分区 M = 8</text>
  <text x="152" y="182" text-anchor="middle" font-size="11" fill="#3B6FB6">固定，决定谁读 / offset</text>
  <rect x="272" y="138" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="380" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">会话 N</text>
  <text x="380" y="182" text-anchor="middle" font-size="11" fill="#3B6FB6">user_id : conversation_id</text>
  <rect x="500" y="138" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="608" y="162" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">每会话串行</text>
  <text x="608" y="182" text-anchor="middle" font-size="11" fill="#3B6FB6">队列 + actor，同会话保序</text>
</g>
<text x="48" y="216" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E40AF">全局 Semaphore(32)：跑满排队、不报错 · 分区是路由单位，会话才是并发单位</text>

<!-- ===== ② Agent 内核 ===== -->
<rect x="30" y="240" width="700" height="150" rx="12" fill="#EEF4FE" stroke="#3B82F6" stroke-width="1"/>
<text x="48" y="268" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#1E3A8A">② Agent 内核 · Loop + Harness + Context + Tools</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="282" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="152" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Main Loop → Once Loop</text>
  <text x="152" y="326" text-anchor="middle" font-size="11" fill="#3B6FB6">while True → ReAct，≤ 200 轮</text>
  <rect x="272" y="282" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="380" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">Harness</text>
  <text x="380" y="326" text-anchor="middle" font-size="11" fill="#3B6FB6">停滞6轮 / 心跳120s</text>
  <rect x="500" y="282" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <text x="608" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#1E3A8A">七层上下文 + 65 工具</text>
  <text x="608" y="326" text-anchor="middle" font-size="11" fill="#3B6FB6">字节预算 · 30+33+2</text>
</g>
<text x="48" y="374" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#1E40AF">失败当观测：工具异常转 Error 回喂，不炸 run；超时 650s，慢工具单开 3600s</text>

<!-- ===== ③ 横切能力 ===== -->
<rect x="30" y="404" width="700" height="140" rx="12" fill="#F3F0FE" stroke="#8B5CF6" stroke-width="1"/>
<text x="48" y="432" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#4C1D95">③ 横切能力 · 生命周期上的安全网</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="446" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="152" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Hook</text>
  <text x="152" y="490" text-anchor="middle" font-size="11" fill="#7C5CC4">11 方法 / 9 业务钩子</text>
  <rect x="272" y="446" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="380" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">Checkpoint</text>
  <text x="380" y="490" text-anchor="middle" font-size="11" fill="#7C5CC4">指针行 + 增量链，断点续跑</text>
  <rect x="500" y="446" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#DDD6FE"/>
  <text x="608" y="470" text-anchor="middle" font-size="13" font-weight="600" fill="#4C1D95">记忆 / Skill</text>
  <text x="608" y="490" text-anchor="middle" font-size="11" fill="#7C5CC4">user·tool 各700B · 渐进6个</text>
</g>
<text x="48" y="530" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#5B21B6">单个 Hook 炸了不影响别人；协议类工具永不折叠（控制流不能压）</text>

<!-- ===== ④ 协作层 ===== -->
<rect x="30" y="556" width="700" height="140" rx="12" fill="#FFF4EC" stroke="#F97316" stroke-width="1"/>
<text x="48" y="584" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#7C2D12">④ 协作层 · 异步拆分与团队</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="598" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="152" y="622" text-anchor="middle" font-size="13" font-weight="600" fill="#7C2D12">SubAgent</text>
  <text x="152" y="642" text-anchor="middle" font-size="11" fill="#C2550F">SpawnTool 派生，工具集收敛</text>
  <rect x="272" y="598" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="380" y="622" text-anchor="middle" font-size="13" font-weight="600" fill="#7C2D12">Agent Team</text>
  <text x="380" y="642" text-anchor="middle" font-size="11" fill="#C2550F">任务板 blockedBy + A2A</text>
  <rect x="500" y="598" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#FED7AA"/>
  <text x="608" y="622" text-anchor="middle" font-size="13" font-weight="600" fill="#7C2D12">Cron</text>
  <text x="608" y="642" text-anchor="middle" font-size="11" fill="#C2550F">文件持久化 + 定时器唤醒</text>
</g>
<text x="48" y="682" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9A3412">子 Agent 不能再派生（防无限递归）；多副本团队必须 TEAM_STORE=pg</text>

<!-- ===== ⑤ 领域编排 ===== -->
<rect x="30" y="708" width="700" height="150" rx="12" fill="#FFF8E8" stroke="#EAB308" stroke-width="1"/>
<text x="48" y="736" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#713F12">⑤ 领域编排 · MCP + DAG 双线</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="750" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="152" y="774" text-anchor="middle" font-size="13" font-weight="600" fill="#713F12">MCP 白名单 33</text>
  <text x="152" y="794" text-anchor="middle" font-size="11" fill="#A16207">25 节点 + 8 契约，改一行生效</text>
  <rect x="272" y="750" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="380" y="774" text-anchor="middle" font-size="13" font-weight="600" fill="#713F12">DAG 引擎</text>
  <text x="380" y="794" text-anchor="middle" font-size="11" fill="#A16207">BaseNode + required_nodes</text>
  <rect x="500" y="750" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#FDE68A"/>
  <text x="608" y="774" text-anchor="middle" font-size="13" font-weight="600" fill="#713F12">22 剪辑 + 3 生成</text>
  <text x="608" y="794" text-anchor="middle" font-size="11" fill="#A16207">细节点 vs 粗粒度，故意不同</text>
</g>
<text x="48" y="844" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#854D0E">严格无环；Store 是节点间的数据总线，不是 Agent Memory；提前终止永远合法</text>

<!-- ===== ⑥ 基础设施 ===== -->
<rect x="30" y="870" width="700" height="132" rx="12" fill="#EEF6FE" stroke="#0EA5E9" stroke-width="1"/>
<text x="48" y="898" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#0C4A6E">⑥ 基础设施 · 存储 / 渲染 / 发布 / 部署</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="912" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="152" y="936" text-anchor="middle" font-size="13" font-weight="600" fill="#0C4A6E">存储</text>
  <text x="152" y="956" text-anchor="middle" font-size="11" fill="#0369A1">PG 23 表 + MinIO，版本认对象键</text>
  <rect x="272" y="912" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="380" y="936" text-anchor="middle" font-size="13" font-weight="600" fill="#0C4A6E">渲染 / 发布</text>
  <text x="380" y="956" text-anchor="middle" font-size="11" fill="#0369A1">三入口 · 直链 ephemeral</text>
  <rect x="500" y="912" width="216" height="58" rx="8" fill="#FFFFFF" stroke="#BAE6FD"/>
  <text x="608" y="936" text-anchor="middle" font-size="13" font-weight="600" fill="#0C4A6E">部署</text>
  <text x="608" y="956" text-anchor="middle" font-size="11" fill="#0369A1">8 容器：存储→editor→app</text>
</g>
<text x="48" y="988" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#075985">时长按 sum(secs)；BGM 无缝 + 侧链闪避；媒体卡确定性生成</text>

<!-- ===== 设计哲学 ===== -->
<rect x="30" y="1014" width="700" height="96" rx="12" fill="#FFF0F0" stroke="#EF4444" stroke-width="1" stroke-dasharray="5 4"/>
<text x="48" y="1042" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="14" font-weight="700" fill="#7F1D1D">核心设计哲学（贯穿六层）</text>
<g font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <rect x="44" y="1054" width="216" height="34" rx="8" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="152" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#7F1D1D">并发安全由声明推导</text>
  <rect x="272" y="1054" width="216" height="34" rx="8" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="380" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#7F1D1D">压缩只压内容，不压控制流</text>
  <rect x="500" y="1054" width="216" height="34" rx="8" fill="#FFFFFF" stroke="#FECACA"/>
  <text x="608" y="1076" text-anchor="middle" font-size="12" font-weight="600" fill="#7F1D1D">限制都在 Harness</text>
</g>
<text x="48" y="1104" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#9F1239">代码只拦空镜，审美交看图模型；阈值只用来校准眼睛，不当追求值</text>
</svg>
