# 上线存储层的本地依赖：PostgreSQL 16（元数据）+ MinIO（媒体字节）。
# 起停：docker compose up -d / docker compose down
# 凭证是本机开发用的默认值；.env 里可覆盖，生产请用部署平台的密钥注入。
# name 必须显式给出：项目目录名含非 ASCII 字符时 compose 无法从路径推导项目名。
name: creation-storage
services:
  postgres:
    image: postgres:16-alpine
    container_name: creation-pg
    environment:
      POSTGRES_USER: ${PG_USER:-creation}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-creation_dev_pw}
      POSTGRES_DB: ${PG_DB:-creation}
    ports:
      - "127.0.0.1:5432:5432"   # 只绑本机:公网部署不暴露数据库
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-creation} -d ${PG_DB:-creation}"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # quay.io 而非 docker.io：本机 Docker 的镜像加速源对 docker.io 库返回 403，
    # Quay 上 minio/minio 是上游官方仓库。
    image: quay.io/minio/minio:latest
    container_name: creation-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-creationdev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-creation_dev_pw_8chars}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 可选：多副本回投广播的 Redis pub/sub。单副本不用起它。
  # 起法：docker compose up -d redis；每个实例加 --broadcast-redis-url redis://localhost:6379/0
  redis:
    # 走 ECR 公共仓库：本机 docker.io 的加速源对 redis 库只回「Pulling fs layer」不放行，
    # 与上面 minio 绕开 docker.io 是同一类问题。
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: creation-redis
    # 不映射宿主机端口:redis 仅作可选的多副本广播,compose 网络内以 redis:6379 访问;
    # 本机若有原生 Redis 服务占用 6379 也不冲突(真要用宿主机访问再临时加映射)。
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20


  # 生产 MQ（R1）。单节点 KRaft，无 ZooKeeper。
  # 为什么它必须和 app 一起起：`run_server.py` 的 `--mq` 缺省已改成 kafka，
  # broker 不在时启动会快速失败（这是设计要的：不再有「生产形态用内存队列」的兜底）。
  # 本地不想起它：`--mq memory` 显式覆盖。
  kafka:
    image: ${KAFKA_IMAGE:-apache/kafka:3.9.0}
    container_name: creation-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # 容器内通告名用服务名：app 用 kafka:9092 连，宿主机用 127.0.0.1:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-8}
    ports:
      - "127.0.0.1:9092:9092"   # 只绑本机：宿主机上的测试脚本要连
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 24
    profiles: ["app"]

  editor:
    build: .
    image: creation-app:latest
    container_name: creation-editor
    command: python run_storyline.py --config examples/storyline/config.docker.toml
    healthcheck:
      # 镜像里没有 curl/wget,用 python socket 探 8001 是否开始接受连接——
      # editor 起 uvicorn 要几秒,app 必须等它就绪,否则启动期 MCP 探测必然撞空。
      test: ["CMD", "python", "-c",
             "import socket;socket.create_connection(('127.0.0.1',8001),timeout=3).close()"]
      interval: 5s
      timeout: 5s
      retries: 24
    environment: &app-env
      # 生产 MQ（R1/D1）：缺省走 Kafka；本地单进程用 --mq memory 覆盖。
      MQ_BACKEND: ${MQ_BACKEND:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      # 同时活跃的会话数上限（D17）。不是线程数：再高只会把上游打到限流。
      MAX_CONCURRENT_SESSIONS: ${MAX_CONCURRENT_SESSIONS:-32}
      # OutBound 消费组的实例名（R2）。多副本时每个实例必须不同。
      INSTANCE_ID: ${INSTANCE_ID:-app-1}
      PG_DSN: postgresql://${PG_USER:-creation}:${PG_PASSWORD:-creation_dev_pw}@postgres:5432/${PG_DB:-creation}
      MINIO_ENDPOINT: minio:9000
      # 直链签名用浏览器解析得到的地址：容器里的 minio:9000 宿主看不见，而 presigned URL
      # 的签名含 Host（事后替换主机名 = 403）。compose 已把 9000 发布在宿主回环，
      # 所以本机默认 127.0.0.1:9000；从别的机器访问页面时，在 .env 里改成本机 LAN IP:9000。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-127.0.0.1:9000}
      MINIO_PUBLIC_SECURE: "0"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-creationdev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-creation_dev_pw_8chars}
      MINIO_SECURE: "0"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      REGISTER_OPEN: ${REGISTER_OPEN:-1}
      QUOTA_LIMIT: ${QUOTA_LIMIT:-0}
      QUOTA_WINDOW: ${QUOTA_WINDOW:-86400}
      # 图形科普片的代码渲染链（独立容器）。editor 与 app 都要能摸到：
      # 出片节点跑在 editor，选区改的补丁口跑在 app。
      REMOTION_URL: ${REMOTION_URL:-http://remotion:8010}
      # 图形科普片的出片调优（说明见 .env.example 末段）
      MOTION_QC: ${MOTION_QC:-preview}
      MOTION_PREVIEW_STILLS: ${MOTION_PREVIEW_STILLS:-1}
      # 须与 remotion 那侧的 DG_RENDER_SLOTS 同步。缺省 4：2026-10-18 实测 20 核机器上
      # 单路约 5 核、2.1 GB，2 路只用到约 10 个核；3 路时 40 镜的成片仍要排一小时
      # （2026-10-20 真机）。4 路刚好吃满 20 核、约 8.5 GB，仍在 15 GB 的余量内。
      MOTION_RENDER_PARALLEL: ${MOTION_RENDER_PARALLEL:-4}
      # 每镜内部的渲染工人数。留空 = Remotion 缺省（min(8, 核/2)）；外并行 4 时缺省是
      # 8×4=32 个工人抢 20 个核，超订 1.6 倍。设成 5 让整机正好吃满，见 code_render。
      MOTION_SHOT_CONCURRENCY: ${MOTION_SHOT_CONCURRENCY:-}
      # 预览静帧同时在飞的镜数（只渲一帧，填满渲染槽即可；与上面同源）。
      MOTION_PREVIEW_PARALLEL: ${MOTION_PREVIEW_PARALLEL:-6}
      # 预览静帧缩放：0.75 的 1440×810 够看构图，像素少 44%。
      MOTION_PREVIEW_SCALE: ${MOTION_PREVIEW_SCALE:-0.75}
      # 逐镜带图评审：缺省开（看片是默认形态的一根柱子——画面全靠写手现写）。
      # RATE 是抽样：1.0＝每镜都看；不想付就设 0。
      #
      # **2026-10-23 从 0.34 提到 1.0。** 0.34 是「每三镜看一镜」，那条片的实跑账是：
      # 12 镜只看了 4 镜（s01/s04/s07/s11），**其中 3 镜没过 —— 失败率 75%**。
      # 抽样率 34% 遇上 75% 的失败率，等于「八成有问题的片子里只改了四分之一」：
      # 没被抽到的 8 镜从头到尾没人看过一眼。抽样省的是评审费，赔的是整片。
      # 代价：评审成本 ×3（每镜一次带图调用）。要省就把 RATE 调回去，别默认省。
      MOTION_VISUAL_REVIEW: ${MOTION_VISUAL_REVIEW:-1}
      MOTION_VISUAL_REVIEW_RATE: ${MOTION_VISUAL_REVIEW_RATE:-1.0}
      # 看片闭环的轮数：1＝看一轮改一轮；2＝改完再看一眼，确认改对了没有。
      MOTION_VISUAL_ROUNDS: ${MOTION_VISUAL_ROUNDS:-2}
      # 计划阶段的并发与重写预算（说明见 .env.example 末段）。
      # 评审已并进一次带图调用；重写缺省不封顶，红几镜改几镜。
      MOTION_WRITER_PARALLEL: ${MOTION_WRITER_PARALLEL:-8}
      MOTION_REVIEW_PARALLEL: ${MOTION_REVIEW_PARALLEL:-8}
      MOTION_REWRITE_PARALLEL: ${MOTION_REWRITE_PARALLEL:-4}
      MOTION_MAX_VISUAL_REWRITES: ${MOTION_MAX_VISUAL_REWRITES:-}
      MOTION_WRITER_MOTION_CHECK: ${MOTION_WRITER_MOTION_CHECK:-1}
      # 草稿渲抽检间隔：每 N 镜验一次运动（第一镜必验）；0＝每镜都验。
      # 缺省 4：每镜一验会让渲染容器 20 核打满，预览静帧都排不进去。
      MOTION_WRITER_MOTION_EVERY: ${MOTION_WRITER_MOTION_EVERY:-4}
      # 模型只有一个来源：页面「设置」里配的那一个。写手 / 美术导演 / 模板作者
      # 都不再有环境变量覆盖口（2026-10-22 撤掉 `MOTION_WRITER_MODEL` 等三项
      # ——它们在 `.env` 里被钉死过，页面上换模型对这三条链不生效）。
    volumes:
      - whisper-cache:/root/.cache
      - app-runtime:/app/.runtime
      # 开发档：后端代码与技能正文直接从仓库挂进来——改完重启容器（几秒）就生效，
      # 不必重建镜像。2026-10-20 的「改完后端要重建容器」就是这一步缺席的代价。
      # 只挂这几个目录，不挂整个 `/app`：镜像里那几份 remotion 源码副本（离线对账
      # 用的哨兵）要留着。前端产物仍在镜像里，改前端依旧要重建。
      - ./backend/agent_framework:/app/agent_framework
      - ./backend/open_storyline:/app/open_storyline
      - ./backend/examples:/app/examples
      - ./backend/prompts:/app/prompts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ["app"]

  # 图形科普片代码渲染链。与 editor 同构：独立常驻服务，Python 侧只是 HTTP 客户端。
  # 为什么单独一个容器 —— Node + Remotion 只服务图形链，它崩了不该带走后端。
  #
  # 这里刻意**不**把 remotion 列进 app/editor 的 depends_on：
  # 存储层没就绪服务必然起不来，而渲染服务没就绪只是「这一镜渲失败」——
  # 把它做成启动依赖，等于让图形链的故障半径扩大到整站。
  remotion:
    build: ./remotion
    image: creation-remotion:latest
    container_name: creation-remotion
    # 不映射宿主端口：只给应用容器在 compose 网络内用（remotion:8010）。
    environment:
      # 同时逐帧渲染的镜数。单路约 5 核 / 2.1 GB：20 核、16 GB 机器上 4 路刚好吃满，
      # 2026-10-20 从 3 提到 4（40 镜成片原来要排一小时）。内存紧就回到 3。
      DG_RENDER_SLOTS: ${DG_RENDER_SLOTS:-4}
    volumes:
      # 用户沉淀的模板源码。卷里只是**缓存**：真相在 PG 的 style_templates，
      # 容器重建/新机器由服务启动时的 sync_validated() 重推；挂卷是为了不必每次
      # 出片前都等一轮推送。
      - template-store:/srv/src/lib/style/generated
    # /dev/shm 默认只有 64M，而 chromium 的渲染进程拿它当共享内存用。软件 WebGL 连渲
    # 二十来帧就能把它耗光，表现是渲染中途 `ProtocolError (Target.closeTarget):
    # Target closed`——**不是**「服务不可达」，是浏览器进程已经死了。
    # 真机代价（2026-10-16，run 9272c7f59501 那 20 镜）：20 镜连续求静帧时 remotion
    # 整个容器退出，那一刻之后所有出片都报 「creation-remotion 不可达
    # （http://remotion:8010/healthz）：[Errno -2] Name or service not known」
    # ——那是容器没了、Docker 顺手撤掉了它的 DNS 记录，是**后果**不是原因。
    shm_size: "1gb"
    # 崩了要能自己回来。原先没有这一位：remotion 一退出就永久躺平，而且**没人会立刻发现**
    # ——app 只在真正出片那一刻才去连它，于是故障可以潜伏几个小时，直到用户点「出片」。
    # `unless-stopped`：手动 stop 的不自动拉起，崩溃的自动拉起（且带上限退避）。
    # 这是**安全网**，不是修复：上面那条 shm 才是修复。
    restart: unless-stopped
    healthcheck:
      # 镜像里没有 curl,用 node 自带的全局 fetch 真打一次 /healthz
      # （端口开着不等于服务应答，探针要问同一个口）。
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8010/healthz').then((r)=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["app"]

  app:
    image: creation-app:latest
    container_name: creation-app
    command: ["python", "run_server.py", "--host", "0.0.0.0", "--port", "8000",
              "--storyline-config", "examples/storyline/config.docker.toml"]
    environment: *app-env
    volumes:
      - whisper-cache:/root/.cache
      - app-runtime:/app/.runtime
      # 与 editor 同一档：后端代码与技能正文挂仓库，改完重启即可（见 editor 那段注释）。
      - ./backend/agent_framework:/app/agent_framework
      - ./backend/open_storyline:/app/open_storyline
      - ./backend/examples:/app/examples
      - ./backend/prompts:/app/prompts
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      editor:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ["app"]

  caddy:
    image: caddy:2-alpine
    container_name: creation-caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      app:
        condition: service_started
    profiles: ["app"]

volumes:
  pgdata:
  miniodata:
  kafkadata:        # Kafka KRaft 日志与 topic 数据
  template-store:   # 用户沉淀的模板源码缓存（真相在 PG）
  whisper-cache:   # faster-whisper 模型缓存(容器化部署时,首次下载持久化)
  caddy-data:      # Caddy 证书与配置
  app-runtime:     # 应用运行时(工作区/对象缓存,跨容器重启保留)

# ---- 生产部署:应用栈(profiles: app)----
# 默认 `docker compose up -d` 只起存储层(本地开发);
# 加 --profile app 才会构建并起「剪辑服务 + 主服务 + Caddy 反代」:
#   cp .env.example .env(改密码/密钥)→ docker compose --profile app up -d --build
# 公网 HTTPS 见 deploy/Caddyfile 注释(SITE_DOMAIN)。
