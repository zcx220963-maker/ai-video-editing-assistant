[pytest]
pythonpath = .
testpaths = tests

# tests/test_*.py 全部是自带 asyncio.run(main()) 的独立脚本（不是 pytest 用例），
# 由 tests/conftest.py 里的 Collector 把它们包成「执行整份脚本」的用例——
# 所以不需要 asyncio_mode，也不能让 pytest 去解析脚本内部的 async def。
#
# 两条等效入口：
#   python -m pytest                 （标准入口，输出落 .tmp/reg_pytest/）
#   python .tmp/run_all_tests.py     （原始入口，输出落 .tmp/reg/）
addopts = -q -p no:cacheprovider
